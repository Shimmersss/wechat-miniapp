<body>
<header class="topbar"><div class="brand"><div class="logo">夏</div><div><strong>夏目数码</strong><small>让价格透明 · 让产品放心</small></div></div><div class="mode"><button data-mode="shop" class="active">顾客端</button><button data-mode="agentCenter">代理端</button><button data-mode="dashboard">员工经营端</button></div><select class="mobile-select" id="mobileSelect"></select></header>
<div class="layout"><aside class="sidebar" id="sidebar"></aside><main class="main"><section class="stage"><div class="device"><div id="app"></div></div></section><aside class="notes"><div class="notes-card"><div class="eyebrow" id="noteGroup"></div><h2 id="noteTitle"></h2><p>夏目数码 V0.3 · 业务流程与权限演示</p><ul id="noteList"></ul><span class="tag-version">示例数据 · 非真实后台</span></div></aside></main></div>
<div class="toast" id="toast"></div>
<script>
const products=[
 {id:1,name:"iPhone 17 Pro",spec:"256G · 冰川蓝 · 99新",retail:7299,wholesale:6999,cost:6450,battery:"96%",stock:"在库",img:"assets/phone_blue_main.png"},
 {id:2,name:"iPhone Air",spec:"128G · 云白色 · 准新",retail:5399,wholesale:5150,cost:4800,battery:"100%",stock:"在库",img:"assets/phone_white_main.png"},
 {id:3,name:"iPhone 16 Pro",spec:"512G · 原色 · 95新",retail:6199,wholesale:5900,cost:5400,battery:"92%",stock:"库龄32天",img:"assets/phone_gold_main.png"}
];
const state={screen:"shop",productId:1,privacy:false,role:"老板",audience:"顾客",markup:200,cost:6450,profit:849,imei:"",shipmentAccepted:false,repairStep:0,loanCreated:false,agentApplied:false,extraField:false};
const navGroups=[
 {label:"顾客与增长",items:[["shop","线上机库"],["agentLanding","成为代理"],["agentCenter","代理中心"]]},
 {label:"采购与库存",items:[["dashboard","经营工作台"],["purchase","采购与验收"],["inbound","扫码入库"],["templates","型号模板"],["inventory","单机库存"]]},
 {label:"业务协同",items:[["repair","维修看板"],["loans","出借与借入"],["share","分渠道分享"]]},
 {label:"系统管理",items:[["staff","员工与审计"]]}
];
const meta={
 shop:["CUSTOMER STOREFRONT","夏目数码线上机库",["统一品牌与口号，零售价对顾客公开。","只显示公开描述，不返回成本、供应商与完整 IMEI。","点击商品进入一机一详情，可申请代理或咨询。"]],
 product:["CUSTOMER PRODUCT","单机详情与放心承诺",["公开实拍、成色、电池与店保信息。","价格按访问身份由服务端决定。","分享海报带渠道归因，但不泄露内部资料。"]],

 purchase:["PURCHASE & ACCEPTANCE","快递在途与验收",["顺丰/京东运单轨迹需合规查询接口。","在途设备不可售，验收通过才转正式库存。","型号、电池、IMEI、成色异常必须阻止入库。"]],
 inbound:["INBOUND WORKFLOW","搜机客式扫码入库",["单台/批量共用型号模板，IMEI1 唯一校验。","成本快捷选，目标利润自动建议零售价。","同行/顾客双描述，设备图与收货凭证分开。"]],

 staff:["IDENTITY & AUDIT","员工身份、数据库分权与日志",["登录、改价、退款、导出、权限变化全程留痕。","业务、只读报表、迁移、备份使用不同数据库账号。","切换角色可演示成本字段的权限差异。"]]
};
const app=document.getElementById("app"),toastEl=document.getElementById("toast");let toastTimer;
function money(n){return Number(n).toLocaleString("zh-CN")}function amount(n){return state.privacy?"••••":money(n)}function toast(s){clearTimeout(toastTimer);toastEl.textContent=s;toastEl.classList.add("show");toastTimer=setTimeout(()=>toastEl.classList.remove("show"),2400)}
function status(dark=false){return `<div class="status ${dark?"dark":""}"><span>9:41</span><span>5G&nbsp;&nbsp;100%</span></div>`}function title(t,back="",dark=false){return `<div class="title ${dark?"dark":""}"><div>${back?`<button class="back" data-action="${back}">‹</button>`:""}<strong>${t}</strong></div><span class="capsule">••• ○</span></div>`}
function bottom(active){return `<nav class="bottom">${[["shop","机库"],["agentLanding","代理"],["dashboard","经营"],["inventory","库存"]].map(([s,t])=>`<button class="${active===s?"active":""}" data-action="navigate" data-screen="${s}">${t}</button>`).join("")}</nav>`}

const renderers={shop,product,agentLanding,agentCenter,dashboard,purchase,inbound,templates,inventory,repair,loans,share,staff};
function render(){app.innerHTML=renderers[state.screen]();document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.screen===state.screen));document.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("active",b.dataset.mode===state.screen||(b.dataset.mode==="dashboard"&&!['shop','product','agentLanding','agentCenter'].includes(state.screen))));const m=meta[state.screen];document.getElementById("noteGroup").textContent=m[0];document.getElementById("noteTitle").textContent=m[1];document.getElementById("noteList").innerHTML=m[2].map(x=>`<li>${x}</li>`).join("");document.getElementById("mobileSelect").value=state.screen}
function buildNav(){document.getElementById("sidebar").innerHTML=navGroups.map(g=>`<div class="side-label">${g.label}</div>${g.items.map(([s,t],i)=>`<button class="nav" data-action="navigate" data-screen="${s}"><span>${t}</span><span class="num">0${i+1}</span></button>`).join("")}`).join("")+`<div class="side-foot">夏目数码 V0.3<br>一套库存 · 多渠道价格<br>全员工留痕 · 未验收不可售</div>`;const ms=document.getElementById("mobileSelect");ms.innerHTML=navGroups.flatMap(g=>g.items).map(([s,t])=>`<option value="${s}">${t}</option>`).join("")}
function navigate(s){state.screen=s;render();document.querySelector(".scroll")?.scrollTo(0,0)}
document.addEventListener("click",e=>{const el=e.target.closest("[data-action],[data-mode]");if(!el)return;if(el.dataset.mode){navigate(el.dataset.mode);return}const a=el.dataset.action;if(a==="navigate")navigate(el.dataset.screen);if(a==="back-shop")navigate("shop");if(a==="open-product"){state.productId=Number(el.dataset.id);navigate("product")}if(a==="privacy"){state.privacy=!state.privacy;render()}if(a==="toast")toast(el.dataset.message);if(a==="agent-apply"){state.agentApplied=true;toast("申请已提交，审核通过后即可共享库存并转发");render()}if(a==="track")toast("已更新顺丰轨迹：正在派送，预计今天 16:00 前送达");if(a==="accept"){state.shipmentAccepted=true;toast("验收通过：3 台设备已转为正式在库");render()}if(a==="scan-imei"){state.imei="356789124502231";toast("IMEI1 扫描成功，全店唯一校验通过");render()}if(a==="cost"){state.cost=Number(el.dataset.cost);render()}if(a==="submit-inbound"){if(!state.imei){toast("请先扫描并确认 IMEI1")}else{toast("入库成功：三价、双描述与模板快照已保存")}}if(a==="add-field"){state.extraField=true;toast("已添加自定义字段“充电次数”");render()}if(a==="repair-next"){state.repairStep=(state.repairStep+1)%4;toast("维修节点已更新，操作人与时间已留痕");render()}if(a==="new-loan"){state.loanCreated=true;toast("出借出库成功：未计入销售与毛利");render()}if(a==="audience"){state.audience=el.dataset.audience;render()}});
document.addEventListener("change",e=>{if(e.target.id==="markupRange"){state.markup=Number(e.target.value);render()}if(e.target.id==="costInput"){state.cost=Number(e.target.value)||0;render()}if(e.target.id==="profitInput"){state.profit=Number(e.target.value)||0;render()}if(e.target.id==="imeiInput"){state.imei=e.target.value.trim()}if(e.target.id==="roleSelect"){state.role=e.target.value;toast(`已切换为${state.role}，成本权限即时生效`);render()}});document.getElementById("mobileSelect").addEventListener("change",e=>navigate(e.target.value));buildNav();render();
</script>
</body>
</html>
